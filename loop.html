<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
h1{ 
    border-radius:10px;
     box-shadow:10px 10px 10px gray ;
    background-color:rgb(1, 39, 39);
    text-align:center;
    font-size:30px;
    font-family: cursive;
    color:rgb(247, 249, 249)
    
}
    
}
</style>
<body>
    <script>
      //For loop
      //break
      //continue
      var n = prompt("Enter a Number to Create table","2")
      document.write("<h1> TABLE OF="+n+"</h1>")
      for(var i=1;i<=10;i++)
     {

        document.write("<h1>"+n+"*"+i+"="+n*i+"</h1>")
     }
     document.write("Loop End")



    </script>
</body>
</html>
