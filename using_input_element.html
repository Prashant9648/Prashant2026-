<body>
  <div class="back"><a href="daily practice work.html"> &larrhk; back</a></div>
    <h1>
     Box 1 <input type="number" id="t1" value="0"><br>
    Box 2 <input type="number" value="0" id="t2"><br/><br/>
    Result <input id="r" type="number" value="0" id="t2"><br/><br/>


    <button onclick="f1()">+</button>
    <button onclick="f2()">-</button>

    <button onclick="f3()">*</button>
    <button onclick="f4()">/</button>

    <script> 
    
    var n1 = document.getElementById("t1")
    var n2 = document.getElementById("t2")
    var n3 = document.getElementById("r")
    
    function f1()
         
    {
    //alert("chal rah ha ")
    var sum = parseInt(n1.value)+parseInt(n2.value)
    n3.value=sum


    }

      function f2()
         
    {
    //alert("chal rah ha ")
    var sum = parseInt(n1.value)-parseInt(n2.value)
    n3.value=sum


    }
      function f3()
         
    {
    //alert("chal rah ha ")
    var sum = parseInt(n1.value)*parseInt(n2.value)
    n3.value=sum


    }
      function f4()
         
    {
    //alert("chal rah ha ")
    var sum = parseInt(n1.value)/parseInt(n2.value)
    n3.value=sum


    }
        
    
    </script>
