<body>
    <h1> Working With Loop in Javascript</h1>
    <table border="1" cellpadding="10">
    <script>
     var row = prompt("Enter Row number to create table..","5")
     var col = prompt("Enter colunm number to create table..","5")
     var c =1
     while(c<=row)
     {
        document.write("<tr>")
            for(var i = 1;i<=col;i++)
        {
            document.write("<td> Prashant <input type='text'></td>")
        }
            document.write("</tr>")
            c++
        
     }

    </script>

    </table>
