<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <h1>Banner With animation</h1>
</head>
<style>
    h1{ background-color: rgb(115, 201, 194);
            color:rgb(2, 27, 27);
            font-size:30px;
            font-family:serif;
            box-shadow:10px 10px 10px gray;
            margin:auto;
            text-align:center;
            
            margin-bottom:10px;
            
    }
    .pic 
    { width:60%;
        height:500px;
        position:absolute;
        left:200px;
        transition: 2s;
        margin: auto;
    }
    
</style>
<header>
 <img src="images/n1.jpg" class="pic">
 <img src="images/n2.jpg" class="pic">      
<img src="images/n3.jpg" class="pic">      
<img src="images/n4.jpg" class="pic"> 
      

    </header>

<body>
    <script>
        //finding images in DOM
        var plist = document.getElementsByTagName("img")
        var p1= plist[3]
        var p2= plist[2]
        var p3= plist[1]
        var p4= plist[0]

        var c = -1
        function runbanner ()
        {
            switch (c)
            {  case 0:
                p1.style.transform="scale(0) rotate(360deg)"
                p1.style.opacity = 0
                break;
                case 1:
                p2.style.transform="scale(0) rotate(360deg)"
                p2.style.opacity = 0
                break;
                case 2:
                p3.style.transform="scale(0) rotate(360deg)"
                p3.style.opacity = 0
                break;
                case 3:
                p4.style.transform="scale(0) rotate(360deg)"
                p4.style.opacity = 0
                break;
                case 4:


                p1.style.transform="scale(1) rotate(0)"
                p2.style.transform="scale(1) rotate(0)"
                p3.style.transform="scale(1) rotate(0)"
                p4.style.transform="scale(1) rotate(0)"


                p1.style.opacity = 1
                p2.style.opacity = 1
                p3.style.opacity = 1
                p4.style.opacity = 1

                
                break;

            }

            if(c<=plist.length)
            {
                c++
            }
            else{
                c = 0

            }
            document.title = c
            setTimeout("runbanner()",1000)
        }
        runbanner()
        //document.title =  "ready"

    
    </script>
    
</body>
</html>
